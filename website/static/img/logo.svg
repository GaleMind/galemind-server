<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="GaleMind">
  <title>GaleMind</title>
  <!-- Three gusts over a rising batch: the wind the server is named for. -->
  <g fill="none" stroke="#2a6fa8" stroke-width="4" stroke-linecap="round">
    <path d="M6 14h22a6 6 0 1 0-6-6" />
    <path d="M6 24h28a6 6 0 1 1-6 6" />
    <path d="M6 34h18" />
  </g>
</svg>
