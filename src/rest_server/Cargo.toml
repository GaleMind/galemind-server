[package]
name = "rest_server"
description = "Predict Protocol v2 HTTP/REST transport for the GaleMind inference server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["rocksdb-store"]
rocksdb-store = ["galemind-service/rocksdb-store"]

[dependencies]
galemind-core.workspace = true
galemind-service.workspace = true
axum.workspace = true
base64.workspace = true
half.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true

[dev-dependencies]
galemind-onnx.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
