[package]
name = "galemind"
description = "GaleMind: a CPU inference server speaking the Predict Protocol v2"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["rocksdb-store"]
rocksdb-store = [
    "galemind-store/rocksdb-store",
    "galemind-service/rocksdb-store",
    "rest_server/rocksdb-store",
    "grpc_server/rocksdb-store",
]
# Replaces glibc's allocator with jemalloc, which returns freed pages to the
# operating system on a decay timer instead of retaining them. glibc has no
# way to do that without calling malloc_trim, which needs FFI; jemalloc keeps
# its unsafe inside its own crate, so this one stays `forbid(unsafe_code)`.
jemalloc = ["tikv-jemallocator", "tikv-jemalloc-ctl"]

[dependencies]
galemind-core.workspace = true
galemind-batching.workspace = true
galemind-cache.workspace = true
galemind-onnx.workspace = true
galemind-service.workspace = true
galemind-store.workspace = true
rest_server.workspace = true
grpc_server.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tikv-jemallocator = { version = "0.7", optional = true }
tikv-jemalloc-ctl = { version = "0.7", optional = true }
