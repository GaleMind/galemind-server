[project]
name = "galemind-client"
version = "0.2.0"
description = "Predict Protocol v2 client for the GaleMind inference server"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
# The HTTP client needs nothing beyond the standard library. gRPC and numpy
# are only needed by the parts that use them.
grpc = ["grpcio>=1.60", "protobuf>=4.25"]
numpy = ["numpy>=1.21"]
dev = ["pytest>=7.0", "grpcio-tools>=1.60"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["galemind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
