[project]
name = "galemind-client"
version = "0.2.0"
description = "Predict Protocol v2 client for the GaleMind inference server"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
]

[project.optional-dependencies]
# The HTTP client needs nothing beyond the standard library. gRPC and numpy
# are only needed by the parts that use them.
grpc = ["grpcio>=1.60", "protobuf>=4.25"]
numpy = ["numpy>=1.21"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "grpcio-tools>=1.60"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["galemind"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["galemind"]
# The Predict Protocol v2 stubs are protoc output, written by `make generate`
# and not committed. They are not this package's code to test.
omit = [
    "galemind/grpc_predict_v2_pb2.py",
    "galemind/grpc_predict_v2_pb2_grpc.py",
]

[tool.coverage.report]
# Matches the Rust workspace's gate in the root Makefile.
fail_under = 80
